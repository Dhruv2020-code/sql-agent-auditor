[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-agent-auditor"
version = "0.1.0"
description = "SQL Agent Auditor for OpenEnv Hackathon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "requests",
    "pandas",
    "python-multipart",
    "openenv>=0.2.0",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
py-modules = ["main", "sql", "inference"]
