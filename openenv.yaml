version: "1.0.0"
env_id: "sql-ecommerce-audit-v1"
runtime: "python3.10"
entrypoint: "main:app"

description: "E-commerce SQL auditing environment with 180+ rows. Agent needs to perform data analysis tasks."

tasks:
  - id: "task_1"
    goal: "Calculate the total revenue from all orders."
    difficulty: "Easy"
    reward_threshold: 1.0
  - id: "task_2"
    goal: "Find top 5 customers who spent the most."
    difficulty: "Medium"
    reward_threshold: 1.0
  - id: "task_3"
    goal: "Identify products with low stock and their suppliers."
    difficulty: "Hard"
    reward_threshold: 1.0